<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370"><rect width="680" height="370" fill="#1a1a1a"/><g font-family="'DM Sans','Noto Sans KR','Malgun Gothic',Arial,sans-serif"><circle cx="31" cy="57" r="3" fill="#e8a045"/><text x="44" y="61" font-size="11" fill="#e8a045" font-weight="300">AI &amp; APPLICATION DEVELOPMENT</text><text x="28" y="122" font-size="36" fill="#f5f2ec" font-weight="300">안녕하세요,</text><text x="28" y="168" font-size="36" fill="#f5f2ec" font-weight="600">이은정입니다.</text><text x="28" y="216" font-size="15" fill="#dedad2" font-weight="300">음성 딥페이크 탐지를 연구하고, 한국어 말투 변환 Android 앱을 개발했습니다.</text><text x="28" y="243" font-size="15" fill="#dedad2" font-weight="300">모델을 학습하고 비교하는 일과 AI 기능을 앱에 연결하는 일을 함께 공부합니다.</text><text x="28" y="286" font-size="15" fill="#dedad2" font-weight="300">AI·머신러닝 / AI 응용 개발 분야로 취업을 준비하고 있습니다.</text><text x="28" y="313" font-size="15" fill="#f5f2ec" font-weight="300">순천향대학교 컴퓨터공학과 · 2027년 2월 졸업 예정</text></g></svg>